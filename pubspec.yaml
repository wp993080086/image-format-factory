name: image_format_factory
description: "图片格式工厂 - 纯本地离线图片编辑工具（Windows / HarmonyOS Next / Android / Web）"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # 开发基线：官方 Flutter 3.44.9；API 面控制在 3.41 兼容范围内（见 AGENTS.md）
  flutter: ">=3.41.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^3.4.3
  # 路由
  go_router: ^18.1.2
  # 图像编解码 / 重采样 / 压缩（纯 Dart，鸿蒙适配面最小化，见 PRD 七.2 架构铁律）
  image: ^4.12.0
  # 文件选择（官方多端插件：Windows / Android / Web）
  file_selector: ^1.1.0
  # 路径（导出临时目录等）
  path_provider: ^2.1.6
  path: ^1.9.1
  # 桌面拖拽导入（仅 Windows 启用，见 PRD 六.1）
  desktop_drop: ^0.8.4
  flutter_localizations:
    sdk: flutter
  # Android SAF 保存面板（仅 Android 启用，见 PRD 七.2 / ADR-007）
  flutter_file_dialog: ^3.3.6
  # Windows WebP 编码走 FFI 调 libwebp，需要内存分配辅助（calloc/malloc）
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 随包分发的原生库许可全文（LGPL-3.0 要求分发时附许可文本）
    - assets/licenses/
